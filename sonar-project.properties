# These come from SonarCloud when the project is created. The organization is
# the SonarCloud account the project lives under, not the GitHub org.
sonar.projectKey=aimansabir_cohort-9-mern-9895-aiman
sonar.organization=aimansabir

sonar.projectName=Notes App
sonar.sourceEncoding=UTF-8

# Application code only. Tests are declared separately below so Sonar measures
# coverage of the source rather than of the tests themselves.
sonar.sources=backend/src,frontend/src
sonar.exclusions=**/*.test.ts,**/*.test.tsx,frontend/src/test/**,frontend/src/main.tsx,frontend/src/vite-env.d.ts

sonar.tests=backend/test,frontend/src
sonar.test.inclusions=backend/test/**/*.ts,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx

# Written by `npm run test:coverage` in each folder
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info
