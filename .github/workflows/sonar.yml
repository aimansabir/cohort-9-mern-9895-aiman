name: SonarCloud

on:
  push:
  pull_request:

jobs:
  analyse:
    name: Tests and analysis
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          # sonar needs the history to work out what is new
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend
        working-directory: backend
        run: npm ci

      # npm install because oxlint's optional wasm bindings resolve to
      # different @emnapi versions on linux than on windows, so npm ci cannot
      # match the lockfile on both
      - name: Install frontend
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Backend tests with coverage
        working-directory: backend
        run: npm run test:coverage

      - name: Frontend tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      # a pull request from a fork does not get the secret, so skip rather
      # than fail
      - name: SonarCloud scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8
