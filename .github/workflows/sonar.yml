name: SonarCloud

on:
  # Any branch, because the analysis has to run on the fork where the token
  # lives. A pull request into the upstream repo runs there instead, and
  # GitHub does not hand a fork's pull request the base repo's secrets.
  push:
  pull_request:

jobs:
  analyse:
    name: Tests and analysis
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Sonar needs the history to work out which code is new
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend
        working-directory: backend
        run: npm ci

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Backend tests with coverage
        working-directory: backend
        run: npm run test:coverage

      - name: Frontend tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      # Skipped rather than failed when there is no token, so a pull request
      # raised from a fork still gets a green tick from the tests above.
      - name: SonarCloud scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8
